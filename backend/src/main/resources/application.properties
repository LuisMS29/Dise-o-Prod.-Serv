# ============================================
# AGROPREDICE PERU - CONFIGURACION
# ============================================

spring.application.name=agropredice-backend
server.port=8080

# ============================================
# BASE DE DATOS MySQL 8.0 (TU CONFIGURACION)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/agropredice_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mypassadmin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool de Conexiones
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=false

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# FLYWAY DESACTIVADO (usamos Hibernate ddl-auto)
# ============================================
spring.flyway.enabled=false

# ============================================
# JWT CONFIGURACION
# ============================================
jwt.secret=AgroPredicePeru2026SeguridadJWTClaveSecretaMuyLargaParaAgricultores
jwt.expiration=86400000

# ============================================
# TWILIO SMS (Configura tus credenciales)
# ============================================
twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.auth.token=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.phone.number=+1234567890

# ============================================
# CORS - Angular Frontend
# ============================================
cors.allowed-origins=http://localhost:4200

# ============================================
# LOGGING
# ============================================
logging.level.com.agropredice=DEBUG
